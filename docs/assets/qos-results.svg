<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="780" viewBox="0 0 1450 780" role="img" aria-labelledby="title desc">
  <title id="title">Verified OLSR QoS results for the NS-3 wireless sensor network experiment</title>
  <desc id="desc">Bar chart derived directly from data/verified-results.csv showing average delay and average jitter for scenarios S1 through S4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>.tt{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}.axis{stroke:#64748b;stroke-width:2}.grid{stroke:#334155;stroke-width:1}.lab{font:500 14px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.sm{font:500 12px Inter,Segoe UI,sans-serif;fill:#94a3b8}.delay{fill:#38bdf8}.jitter{fill:#f59e0b}</style>
  </defs>
  <rect width="1450" height="780" fill="url(#bg)"/>
  <text x="70" y="62" class="tt">NS-3 WSN Routing — Verified OLSR QoS Results</text>
  <text x="70" y="92" class="sub">Direct visualization of data/verified-results.csv; AODV is trace-backed separately and is not mixed into this numerical chart</text>

  <line x1="160" y1="625" x2="1260" y2="625" class="axis"/><line x1="160" y1="150" x2="160" y2="625" class="axis"/>
  <line x1="160" y1="517" x2="1260" y2="517" class="grid"/><line x1="160" y1="409" x2="1260" y2="409" class="grid"/><line x1="160" y1="301" x2="1260" y2="301" class="grid"/><line x1="160" y1="193" x2="1260" y2="193" class="grid"/>
  <text x="122" y="630" class="lab">0</text><text x="115" y="522" class="lab">5</text><text x="108" y="414" class="lab">10</text><text x="108" y="306" class="lab">15</text><text x="108" y="198" class="lab">20</text>
  <text x="72" y="400" class="lab" transform="rotate(-90 72 400)">Milliseconds</text>

  <!-- scale: 21.6 px per ms -->
  <rect x="255" y="604.33" width="70" height="20.67" rx="5" class="delay"/><rect x="335" y="622.83" width="70" height="2.17" rx="2" class="jitter"/>
  <rect x="510" y="510.95" width="70" height="114.05" rx="5" class="delay"/><rect x="590" y="569.04" width="70" height="55.96" rx="5" class="jitter"/>
  <rect x="765" y="526.51" width="70" height="98.49" rx="5" class="delay"/><rect x="845" y="622.71" width="70" height="2.29" rx="2" class="jitter"/>
  <rect x="1020" y="187.72" width="70" height="437.28" rx="5" class="delay"/><rect x="1100" y="431.06" width="70" height="193.94" rx="5" class="jitter"/>

  <text x="266" y="595" class="sm">0.957</text><text x="338" y="607" class="sm">0.100</text>
  <text x="519" y="501" class="sm">5.280</text><text x="599" y="559" class="sm">2.591</text>
  <text x="774" y="517" class="sm">4.560</text><text x="848" y="607" class="sm">0.106</text>
  <text x="1023" y="178" class="sm">20.244</text><text x="1107" y="421" class="sm">8.979</text>

  <text x="292" y="658" class="lab">S1</text><text x="547" y="658" class="lab">S2</text><text x="802" y="658" class="lab">S3</text><text x="1057" y="658" class="lab">S4</text>
  <text x="228" y="684" class="sm">100 B · 1 source</text><text x="483" y="684" class="sm">100 B · 5 sources</text><text x="733" y="684" class="sm">1000 B · 1 source</text><text x="983" y="684" class="sm">1000 B · 5 sources</text>

  <rect x="935" y="112" width="18" height="18" rx="3" class="delay"/><text x="963" y="127" class="lab">Avg. delay</text><rect x="1075" y="112" width="18" height="18" rx="3" class="jitter"/><text x="1103" y="127" class="lab">Avg. jitter</text>
  <text x="70" y="735" class="sm">All four retained OLSR scenarios report 0% packet loss. The high-load S4 case (1000 B, 5 sources) has the highest retained delay and jitter.</text>
</svg>